[platformio]
default_envs = game

[env:proton]
platform = https://github.com/norandomtechie/platform-raspberrypi#feature/proton-picosdk-support
board = proton
framework = picosdk
debug_tool = picoprobe
upload_protocol = picoprobe
monitor_speed = 115200

; Standalone instructor UART communication test
[env:uart_link_test]
extends = env:proton

build_src_filter =
    +<uart_link_test_main.c>
    +<uart/uart_instructor_v2.c>
    +<tft/tft_display.c>

; Standalone SPI TFT test
[env:tft_test]
extends = env:proton

build_src_filter =
    +<tft_test_main.c>
    +<tft/tft_display.c>

; Full instructor game
; UART1 + SPI TFT + password validation
[env:game]
extends = env:proton

build_src_filter =
    +<main.c>
    +<uart/uart_instructor_v2.c>
    +<tft/tft_display.c>
    +<timer/game_timer.c>
    +<game_screens/game_screens.c>
    +<password/password.c>
    +<maze/maze.c>
    +<game/game_controller.c>
    +<led_matrix/hub75.c>

[env:hub75_test]
extends = env:proton

build_src_filter =
    +<hub75_test_main.c>
    +<led_matrix/hub75.c>
    +<maze/maze.c>
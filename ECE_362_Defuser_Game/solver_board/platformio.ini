[platformio]
default_envs = proton

[env:proton]
platform = https://github.com/norandomtechie/platform-raspberrypi#feature/proton-picosdk-support
board = proton
framework = picosdk
debug_tool = picoprobe
upload_protocol = picoprobe
monitor_port = COM5
monitor_speed = 115200
monitor_filters = default
; Normal build uses main.c, not the LED test
build_src_filter =
    +<*>
    -<led_test_main.c>
    -<uart/uart_sb.c>

; Optional PIO LED test
[env:led_test]
extends = env:proton

; Test build uses led_test_main.c, not main.c
build_src_filter =
    +<*>
    -<main.c>
    -<uart/uart_sb.c>
    -<uart/uart_solver_v2.c>
    -<game/game_controller.c>